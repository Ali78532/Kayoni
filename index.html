<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>لعبة كيوني</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Lalezar&display=swap">
<style>
/* Layout: one full-bleed canvas world. HUD pills across the top, two pedal hints in the bottom corners
   (right = go, left = brake), a toy-sticker start card in the middle. The look commits to one daylight world. */
:root {
  --sky-top: #5fc3f3;
  --sky-low: #dcf4ff;
  --grass: #5db93a;
  --grass-dark: #3a8527;
  --soil: #b06e34;
  --soil-dark: #7e4a22;
  --coin: #ffc928;
  --coin-dark: #c98600;
  --ink: #1b2a52;
  --paper: #fff7e2;
  --go: #ff7b3a;
  --stop: #3f8fe6;
  --font-display: 'Lalezar', 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  --font-body: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
  color-scheme: light;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--sky-low);
  color: var(--ink);
  font-family: var(--font-body);
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
#touch { position: fixed; inset: 0; z-index: 5; touch-action: none; }

#hud {
  position: fixed; z-index: 10; left: 0; right: 0;
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 10px;
  pointer-events: none;
}
.pill {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 14px 4px 12px; min-height: 40px; box-sizing: border-box;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 999px;
  box-shadow: 0 4px 0 var(--ink);
  font-family: var(--font-display); font-size: 24px; line-height: 1; color: var(--ink);
}
.pill .lbl { font-family: var(--font-body); font-weight: 800; font-size: 13px; opacity: .75; }
.pill .unit { font-family: var(--font-body); font-weight: 800; font-size: 14px; }
.pill b { font-weight: 400; font-variant-numeric: tabular-nums; min-width: 1ch; }
.pill.coin { background: var(--coin); }
.pill.coin svg { width: 26px; height: 26px; flex: none; }
#mute {
  margin-inline-start: auto; pointer-events: auto;
  width: 44px; height: 44px; padding: 0; display: grid; place-items: center;
  background: var(--paper); border: 3px solid var(--ink); border-radius: 50%;
  box-shadow: 0 4px 0 var(--ink); color: var(--ink); cursor: pointer;
}
#mute:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--ink); }
#mute:focus-visible, #startBtn:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }
#mute svg { width: 24px; height: 24px; }
#mute .slash { display: none; }
#mute.off .waves { display: none; }
#mute.off .slash { display: block; }

.pedal {
  position: fixed; z-index: 6; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  width: 112px; height: 74px; box-sizing: border-box; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  border: 3px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 var(--ink);
  font-family: var(--font-display); font-size: 21px; line-height: 1; color: #fff;
  opacity: .82; transition: transform .06s, box-shadow .06s, opacity .06s;
}
.pedal svg { width: 34px; height: 24px; }
.pedal.gas { right: max(16px, env(safe-area-inset-right, 0px)); background: var(--go); }
.pedal.brake { left: max(16px, env(safe-area-inset-left, 0px)); background: var(--stop); }
.pedal.on { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); opacity: 1; }

#toast {
  position: fixed; z-index: 11; left: 50%; top: 22%; translate: -50% 0;
  font-family: var(--font-display); font-size: 46px; color: var(--coin);
  -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink);
  pointer-events: none; opacity: 0; white-space: nowrap;
}
#toast.show { animation: pop 1.3s ease-out; }
@keyframes pop {
  0% { opacity: 0; transform: scale(.4); }
  15% { opacity: 1; transform: scale(1.15); }
  30% { transform: scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translateY(-24px) scale(1); }
}
#rot {
  position: fixed; z-index: 11; left: 50%; translate: -50% 0;
  top: calc(env(safe-area-inset-top, 0px) + 64px);
  padding: 6px 14px; border-radius: 999px; background: var(--ink); color: #fff;
  font-weight: 800; font-size: 14px; white-space: nowrap; pointer-events: none;
}

#start {
  position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(27, 42, 82, .28); overflow: auto;
}
.card {
  width: min(100%, 420px); box-sizing: border-box; margin-top: 44px;
  background: var(--paper); border: 4px solid var(--ink); border-radius: 28px; box-shadow: 0 8px 0 var(--ink);
  padding: 58px 22px 20px; text-align: center; position: relative;
}
.face {
  position: absolute; top: -48px; left: 50%; translate: -50% 0; width: 96px; height: 96px;
  border-radius: 50%; border: 4px solid var(--ink); background: var(--sky-top); overflow: hidden;
  display: grid; place-items: end center; box-shadow: 0 4px 0 var(--ink);
}
.face img { width: 80px; height: auto; display: block; margin-bottom: -2px; }
h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 44px; line-height: 1.1; text-wrap: balance; }
.sub { margin: 6px 0 14px; font-weight: 600; font-size: 16px; line-height: 1.5; text-wrap: balance; }
.how { display: grid; gap: 8px; margin: 0 0 14px; padding: 0; list-style: none; text-align: start; }
.how li { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 15px; }
.how i {
  flex: none; width: 54px; height: 32px; border: 3px solid var(--ink); border-radius: 12px;
  display: grid; place-items: center; color: #fff; font-style: normal; font-family: var(--font-display); font-size: 14px;
}
.how i.g { background: var(--go); }
.how i.b { background: var(--stop); }
.best { margin: 0 0 12px; font-weight: 800; font-size: 14px; opacity: .8; }
#startBtn {
  width: 100%; min-height: 56px; border: 4px solid var(--ink); border-radius: 18px; cursor: pointer;
  background: var(--go); color: #fff; font-family: var(--font-display); font-size: 30px; line-height: 1;
  box-shadow: 0 6px 0 var(--ink);
}
#startBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
@media (max-height: 420px) {
  .card { margin-top: 36px; padding-top: 52px; padding-bottom: 14px; }
  .face { width: 80px; height: 80px; top: -40px; }
  .face img { width: 66px; }
  h1 { font-size: 34px; }
  .sub { margin-bottom: 8px; font-size: 14px; }
  .how { margin-bottom: 8px; gap: 5px; }
  .how li { font-size: 14px; }
  .best { margin-bottom: 8px; }
  #startBtn { min-height: 46px; font-size: 26px; }
}
@media (prefers-reduced-motion: reduce) { #toast.show { animation: none; opacity: 1; } }
</style>

<script>document.documentElement.dir = 'rtl'; document.documentElement.lang = 'ar';</script>
<canvas id="stage" aria-label="لعبة سيارة تصعد وتنزل التلال وتجمع العملات"></canvas>
<div id="touch"></div>

<div id="hud">
  <div class="pill coin" aria-label="العملات">
    <svg viewBox="0 0 28 28" aria-hidden="true"><circle cx="14" cy="14" r="12" fill="#ffd54a" stroke="#1b2a52" stroke-width="3"/><circle cx="14" cy="14" r="6.5" fill="none" stroke="#c98600" stroke-width="2.5"/></svg>
    <b id="coinV">0</b>
  </div>
  <div class="pill" aria-label="المسافة"><span class="lbl">المسافة</span><b id="distV">0</b><span class="unit">م</span></div>
</div>



<div id="toast" aria-live="polite"></div>
<div id="rot" hidden>الأفضل أن تقلب الهاتف أفقياً</div>

<div id="start">
  <div class="card">
    <div class="face"><img id="faceImg" alt=""></div>
    <h1>لعبة كيوني</h1>
    <p class="sub">قُد السيارة فوق التلال واجمع كل العملات</p>
    <ul class="how">
      <li><i class="g">أمام</i>اضغط على يمين الشاشة لتتقدم</li>
      <li><i class="b">خلف</i>اضغط على يسار الشاشة لتتوقف ثم ترجع للخلف</li>
      <li><i class="g" style="background:#e5484d">!</i>في الهواء: يمين يميل للأمام ويسار يميل للخلف. إن لمس رأسك الأرض تخسر!</li>
    </ul>
    <p class="best" id="bestLine" hidden></p>
    <button id="startBtn" type="button">ابدأ</button>
  </div>
</div>

/* ---------- terrain ---------- */
function G(x) {                                  // world y of the ground (y grows downward)
  const f = smooth(250, 1500, x);
  const A = 16 + 58 * f + 22 * smooth(3000, 12000, x);
  const s = smooth(180, 700, x);
  return -s * A * (0.55 * Math.sin(x / 320) + 0.30 * Math.sin(x / 155 + 1.1) + 0.15 * Math.sin(x / 84 + 2.3)) - tallH(x);
}
function tallH(x) {                              // tall hills: long gentle climb, steep drop
  const k = Math.floor((x - 1800) / 2400); if (k < 0) return 0;
  const h = Math.min(260, 150 + k * 25), c = h * 6, d = h * 1.5, u = x - 1800 - k * 2400;
  if (u < c) return h * smooth(0, c, u);
  if (u < c + d) return h * (1 - smooth(c, c + d, u));
  return 0;
}

const L = 160;                                   // distance between wheel centres (world units)

const K = L / Math.hypot(sdx, sdy);              // world units per sprite pixel
const sprAng = Math.atan2(sdy, sdx);

const rR = SPR.rear.r * K, rF = SPR.front.r * K;

}

const touch = document.getElementById('touch');

const sideOf = e => ((PORT ? e.clientY : e.clientX) > (PORT ? innerHeight : innerWidth) / 2 ? 'g' : 'b');

  genCoins(camX + W / Z + 1400);
  while (coins.length && coins[0].x < camX - 400) coins.shift();
  const tx = A.xr - (W * 0.3) / Z + car.v * 0.22, ty = (A.yr + A.yf) / 2;
  if (!camReady) { camX = tx; camY = ty; camReady = true; }
  camX += (tx - camX) * Math.min(1, dt * 6); camY += (ty - camY) * Math.min(1, dt * 3);
  const d = Math.max(0, (car.xr - START_X) / 10);
  if (Math.floor(d) !== distShown) { distShown = Math.floor(d); distV.textContent = fmt(distShown); }
  if (started && d >= nextYes) { sfx('yes'); nextYes = (Math.floor(d / 400) + 1) * 400; }
  if (started && d > best && time - lastSave > 1.5) { best = Math.floor(d); store.set('hills.best', String(best)); lastSave = time; }
  if (rotTimer > 0 && started) { rotTimer -= dt; if (rotTimer <= 0) updateRot(); }
  engineSound();
  render(A);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize); window.addEventListener('orientationchange', () => setTimeout(resize, 150));
resize();
if (document.fonts && document.fonts.load) document.fonts.load('20px Lalezar').catch(() => {});

  coinV.textContent = fmt(0);
  requestAnimationFrame(frame);
});
